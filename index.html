<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatcha</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            color: #00BFFF;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background-color: #081b2b;
            background-image: linear-gradient(135deg, #0a3d57 30%, #081b2b 70%);
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            background-color: #0d2a4d;
        }

        .container h1 {
            font-size: 2.5em;
            font-weight: 500;
            margin: 10px 0;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .chat-container {
            width: 100%;
            max-height: 60vh;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .message {
            display: flex;
            align-items: flex-start;
            margin: 10px 0;
            padding: 10px;
            background-color: #1e3b52;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .message img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .message-content {
            color: #fff;
        }

        .message-content p {
            margin: 5px 0;
            font-size: 1.1em;
        }

        .message-content .text {
            margin-top: 5px;
        }

        .message img.message-image {
            max-width: 100px;
            max-height: 100px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .input-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
        }

        .input-container input,
        .input-container button,
        .input-container label {
            padding: 12px;
            font-size: 1em;
            border-radius: 8px;
            border: none;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .input-container input,
        .input-container button {
            width: 45%;
        }

        .input-container label {
            width: 45%;
        }

        .input-container button:hover,
        .input-container label:hover {
            background-color: #1E90FF;
            transform: scale(1.05);
        }

        .input-container input:focus,
        .input-container button:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 191, 255, 1);
        }

        .input-container input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Chatcha</h1>

        <!-- Profile section -->
        <div class="input-container">
            <input type="text" id="username" placeholder="Enter your username" />
            <label for="pfpInput">Upload PFP</label>
            <input type="file" id="pfpInput" accept="image/*" />
        </div>

        <div class="chat-container" id="chatContainer"></div>

        <!-- Message input section -->
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Type your message..." />
            <button id="sendBtn">Send</button>
            <label for="imageInput">Attach Image</label>
            <input type="file" id="imageInput" accept="image/*" />
        </div>
    </div>

    <script>
        const sendBtn = document.getElementById('sendBtn');
        const messageInput = document.getElementById('messageInput');
        const chatContainer = document.getElementById('chatContainer');
        const pfpInput = document.getElementById('pfpInput');
        const usernameInput = document.getElementById('username');
        const imageInput = document.getElementById('imageInput');
        let username = '';
        let pfpUrl = '';

        // Handle username and profile picture
        pfpInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    pfpUrl = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        usernameInput.addEventListener('input', (event) => {
            username = event.target.value;
        });

        sendBtn.addEventListener('click', () => {
            const messageText = messageInput.value.trim();
            const imageFile = imageInput.files[0];

            if (messageText || imageFile) {
                const messageElement = document.createElement('div');
                messageElement.classList.add('message');

                const profilePic = pfpUrl || 'https://i.postimg.cc/hPtHMykg/1323886286343376946remix-1735709522669.png'; // Default PFP

                messageElement.innerHTML = `
                    <img src="${profilePic}" alt="Profile Picture">
                    <div class="message-content">
                        <p><strong>${username || 'Anonymous'}:</strong></p>
                        <p class="text">${messageText}</p>
                    </div>
                `;

                if (imageFile) {
                    const imageUrl = URL.createObjectURL(imageFile);
                    messageElement.querySelector('.message-content').innerHTML += `
                        <img class="message-image" src="${imageUrl}" alt="Message Image">
                    `;
                }

                chatContainer.appendChild(messageElement);
                messageInput.value = '';
                imageInput.value = '';
                chatContainer.scrollTop = chatContainer.scrollHeight; // Scroll to the latest message
            }
        });
    </script>

</body>
</html>
