<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatcha</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      color: #00BFFF;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      background-color: #081b2b;
      background-image: linear-gradient(135deg, #0a3d57 30%, #081b2b 70%);
    }

    .chat-container {
      background-color: #0d2a4d;
      width: 100%;
      max-width: 700px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .header {
      padding: 20px;
      background-color: #0a3d57;
      text-align: center;
      font-size: 2em;
      font-weight: 500;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      display: flex;
      align-items: flex-start;
      margin-bottom: 15px;
    }

    .message img.pfp {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .message-content {
      background-color: #123456;
      padding: 10px;
      border-radius: 8px;
      max-width: 80%;
      color: white;
    }

    .message-content img.attachment {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 8px;
    }

    .input-area {
      display: flex;
      padding: 15px;
      border-top: 2px solid #00BFFF;
      background-color: #0d2a4d;
      gap: 10px;
    }

    .input-area input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-size: 1em;
    }

    .input-area input[type="file"] {
      color: white;
    }

    .input-area button {
      background-color: #00BFFF;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      font-family: 'Quicksand', sans-serif;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .input-area button:hover {
      background-color: #1E90FF;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">Chatcha</div>
    <div class="messages" id="messages"></div>
    <form class="input-area" id="messageForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="file" id="imageInput" accept="image/*">
      <input type="text" id="messageInput" placeholder="Type a message..." required>
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const messageForm = document.getElementById('messageForm');
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const usernameInput = document.getElementById('username');
    const imageInput = document.getElementById('imageInput');

    function appendMessage(username, text, imageUrl, pfp) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';
      msgDiv.innerHTML = `
        <img src="${pfp}" class="pfp" onerror="this.src='https://i.postimg.cc/hPtHMykg/1323886286343376946remix-1735709522669.png'">
        <div class="message-content">
          <strong>${username}</strong><br>
          ${text}
          ${imageUrl ? `<br><img src="${imageUrl}" class="attachment">` : ''}
        </div>
      `;
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    messageForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = usernameInput.value.trim();
      const text = messageInput.value.trim();
      const imageFile = imageInput.files[0];

      let imageUrl = '';

      if (imageFile) {
        const formData = new FormData();
        formData.append('image', imageFile);

        const uploadRes = await fetch('/upload', {
          method: 'POST',
          body: formData
        });
        const uploadData = await uploadRes.json();
        imageUrl = uploadData.url;
      }

      const messageData = { username, text, imageUrl };
      await fetch('/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(messageData)
      });

      messageInput.value = '';
      imageInput.value = '';
    });

    async function loadMessages() {
      const res = await fetch('/messages');
      const data = await res.json();
      messagesContainer.innerHTML = '';
      data.forEach(msg => {
        appendMessage(msg.username, msg.text, msg.imageUrl, msg.pfp || 'https://i.postimg.cc/hPtHMykg/1323886286343376946remix-1735709522669.png');
      });
    }

    setInterval(loadMessages, 3000);
    loadMessages();
  </script>
</body>
</html>
