<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            color: #00BFFF;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background-color: #081b2b;
            background-image: linear-gradient(135deg, #0a3d57 30%, #081b2b 70%);
        }

        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .container h1 {
            font-size: 2.5em;
            font-weight: 500;
            margin: 10px 0;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }

        .container p {
            margin: 10px 0;
            font-size: 1.3em;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }

        .server-card {
            background-color: #0d2a4d;
            padding: 15px;
            border-radius: 10px;
            max-width: 300px;
            margin: 20px auto;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .server-card img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            float: left;
            margin-right: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .server-card h3, .server-card p {
            margin: 5px 0;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }

        .server-card button {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            background-color: #00BFFF;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            font-family: 'Quicksand', sans-serif;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .server-card button:hover {
            background-color: #1E90FF;
            transform: scale(1.05);
        }

        .menu-button {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            background-color: #00BFFF;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            font-family: 'Quicksand', sans-serif;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .menu-button:hover {
            background-color: #1E90FF;
            transform: scale(1.05);
        }

        .chat-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease, visibility 1s ease;
            z-index: 5;
            text-align: center;
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .chat-message {
            font-size: 1.1em;
            margin: 10px 0;
            color: #00BFFF;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            padding: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(0, 191, 255, 0.1);
            width: 105%;
        }

        .chat-message img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .chat-message .message-text {
            flex-grow: 1;
            text-align: left;
        }

        .back-button {
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #00BFFF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .back-button:hover {
            background-color: #1E90FF;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chatcha</h1>
        <p>Welcome to Chatcha</p>

        <div class="server-card">
            <img src="https://i.postimg.cc/hPtHMykg/1323886286343376946remix-1735709522669.png" alt="Server Icon">
            <div>
                <h3>Chatcha's Server</h3>
                <p>Join our Chat Server!</p>
            </div>
            <a href="https://discord.gg/KPYgmmBZbQ" target="_blank">
                <button>Join Server</button>
            </a>
        </div>

        <div>
            <button class="menu-button">Start Chatting</button>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-message">
            <img src="https://i.postimg.cc/hPtHMykg/1323886286343376946remix-1735709522669.png" alt="User Profile">
            <div class="message-text">Hello, this is a test message!</div>
        </div>

        <input type="file" id="file-upload" accept="image/*">
        <input type="text" id="message-input" placeholder="Type your message here">
        <button id="send-button">Send</button>
    </div>

    <script>
        const menuButton = document.querySelector('.menu-button');
        const container = document.querySelector('.container');
        const chatContainer = document.querySelector('.chat-container');
        const sendButton = document.querySelector('#send-button');
        const messageInput = document.querySelector('#message-input');
        const fileUpload = document.querySelector('#file-upload');

        menuButton.addEventListener('click', () => {
            container.style.opacity = 0;
            container.style.visibility = 'hidden';
            setTimeout(() => {
                chatContainer.style.opacity = 1;
                chatContainer.style.visibility = 'visible';
            }, 1000);
        });

        sendButton.addEventListener('click', () => {
            const messageText = messageInput.value;
            const file = fileUpload.files[0];

            if (messageText.trim() || file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const newMessage = document.createElement('div');
                    newMessage.classList.add('chat-message');
                    
                    if (file) {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        newMessage.appendChild(img);
                    }

                    const text = document.createElement('div');
                    text.classList.add('message-text');
                    text.textContent = messageText;
                    newMessage.appendChild(text);

                    chatContainer.appendChild(newMessage);
                    messageInput.value = '';
                    fileUpload.value = '';
                };
                
                if (file) {
                    reader.readAsDataURL(file);
                }
            }
        });
    </script>
</body>
</html>
